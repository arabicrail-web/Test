<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aula 1</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0a06;
      --gold: #c9a84c;
      --gold-light: #e8c97a;
      --cream: #f0e6d0;
      --dim: #7a6a52;
    }

    body {
      background-color: var(--bg);
      color: var(--cream);
      font-family: 'Lora', Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(201,168,76,0.06) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 80%, rgba(201,168,76,0.04) 0%, transparent 60%);
    }

    .ornament {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.2rem;
      width: 100%;
      max-width: 720px;
    }
    .ornament::before, .ornament::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
    }
    .ornament span {
      color: var(--gold);
      font-size: 1.1rem;
      letter-spacing: 0.15em;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.4rem, 4vw, 2rem);
      letter-spacing: 0.12em;
      color: var(--gold-light);
      text-align: center;
      margin-bottom: 0.4rem;
      text-shadow: 0 0 30px rgba(201,168,76,0.3);
    }

    .subtitle {
      font-style: italic;
      color: var(--dim);
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 2rem;
      letter-spacing: 0.05em;
    }

    .player-shell {
      width: 100%;
      max-width: 720px;
      border: 1px solid rgba(201,168,76,0.25);
      border-radius: 4px;
      overflow: hidden;
      background: #000;
      box-shadow:
        0 0 0 1px rgba(201,168,76,0.08),
        0 8px 40px rgba(0,0,0,0.7),
        0 0 60px rgba(201,168,76,0.05);
    }

    .ratio-box {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
    }

    .ratio-box iframe {
      border: 0;
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      display: block;
    }

    .footer-orn {
      margin-top: 1.8rem;
      color: var(--dim);
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <div class="ornament"><span>✦</span></div>

  <h1>Aula 1</h1>
  <p class="subtitle">Utilize os controles abaixo para navegar</p>

  <div class="player-shell">
    <div class="ratio-box">
      <iframe
        src="https://player.mediadelivery.net/embed/675239/4d22b9fe-15c9-499f-b91f-0d7f4ce6be9d?autoplay=false&loop=false&muted=false&preload=true&responsive=true"
        loading="lazy"
        allow="accelerometer;gyroscope;autoplay;encrypted-media;picture-in-picture;fullscreen;"
        allowfullscreen="true">
      </iframe>
    </div>
  </div>

  <p class="footer-orn">⬡ conteúdo exclusivo ⬡</p>

</body>
</html>
